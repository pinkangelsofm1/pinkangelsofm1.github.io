<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carlota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #f5f0ea;
    --dark: #1a1410;
    --rose: #c8736a;
    --rose-light: #e8a89f;
    --muted: #8a7d74;
  }

  body {
    background: var(--cream);
    min-height: 100vh;
    font-family: 'DM Sans', sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 0;
  }

  .page {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    background: var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  /* HERO FOTO */
  .hero {
    width: 100%;
    position: relative;
    overflow: hidden;
  }

  .hero img {
    width: 100%;
    height: 520px;
    object-fit: cover;
    object-position: center top;
    display: block;
    filter: brightness(0.92) contrast(1.05) saturate(0.9);
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 180px;
    background: linear-gradient(transparent, var(--cream));
  }

  /* CONTENT */
  .content {
    width: 100%;
    padding: 0 28px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    margin-top: -60px;
    position: relative;
    z-index: 1;
  }

  .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 56px;
    font-weight: 300;
    color: var(--dark);
    letter-spacing: -0.5px;
    text-align: center;
    line-height: 1;
    margin-bottom: 6px;
    animation: fadeUp 0.8s ease both;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--rose);
    margin: 14px auto;
    animation: fadeUp 0.8s 0.1s ease both;
  }

  .bio {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-weight: 300;
    font-style: italic;
    color: var(--muted);
    text-align: center;
    line-height: 1.7;
    max-width: 300px;
    animation: fadeUp 0.8s 0.2s ease both;
    margin-bottom: 4px;
  }

  .cta-text {
    font-size: 13px;
    color: var(--rose);
    text-align: center;
    letter-spacing: 0.5px;
    margin-top: 4px;
    animation: fadeUp 0.8s 0.3s ease both;
    font-weight: 400;
  }

  /* BOTÓN ONLYFANS */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 28px;
    animation: fadeUp 0.8s 0.4s ease both;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px 24px;
    border-radius: 4px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.12);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .btn:hover::before { opacity: 1; }
  .btn:active { transform: scale(0.98); }

  .btn-of {
    background: var(--dark);
    color: var(--cream);
    border: 1px solid var(--dark);
  }

  .btn-of:hover {
    background: var(--rose);
    border-color: var(--rose);
  }

  .btn-icon {
    font-size: 16px;
    flex-shrink: 0;
  }

  /* FOOTER */
  .footer {
    margin-top: 40px;
    text-align: center;
    animation: fadeUp 0.8s 0.5s ease both;
  }

  .footer-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0.6;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
